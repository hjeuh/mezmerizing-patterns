<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesmerizing Patterns</title>
    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
            color: white;
            font-family: Arial, sans-serif;
            cursor: default;
        }
        canvas {
            display: block;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
        }
        button {
            margin: 5px;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            background-color: #444;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #666;
        }
        #speedControl {
            margin-top: 10px;
        }
        .hidden-cursor {
            cursor: none;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button onclick="changePattern(0)">Pattern 1</button>
        <button onclick="changePattern(1)">Pattern 2</button>
        <button onclick="changePattern(2)">Pattern 3</button>
        <button onclick="changePattern(3)">Pattern 4</button>
        <button onclick="changePattern(4)">Pattern 5</button>
        <button onclick="toggleControls()">Hide Controls</button>
        <div id="speedControl">
            <label for="speed">Speed:</label>
            <input type="range" id="speed" min="1" max="10" value="1">
        </div>
    </div>
    <canvas id="patternCanvas"></canvas>

    <script>
        const canvas = document.getElementById('patternCanvas');
        const ctx = canvas.getContext('2d');
        const controls = document.getElementById('controls');
        const speedControl = document.getElementById('speed');

        // Resize canvas to fit the window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();

        window.addEventListener('resize', resizeCanvas);

        let time = 0;
        let currentPattern = 0;
        let speed = 1;
        let controlsVisible = true;

        speedControl.addEventListener('input', (event) => {
            speed = parseInt(event.target.value, 10);
        });

        function toggleControls() {
            controlsVisible = !controlsVisible;
            controls.style.display = controlsVisible ? 'block' : 'none';
            document.body.classList.toggle('hidden-cursor', !controlsVisible);
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === '7') {
                toggleControls();
            }
        });

        function pattern1() {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;

            for (let i = 0; i < 360; i += 10) {
                const angle = (i + time) * Math.PI / 180;
                const x = centerX + Math.cos(angle) * (100 + 50 * Math.sin(time / 50));
                const y = centerY + Math.sin(angle) * (100 + 50 * Math.sin(time / 50));

                ctx.beginPath();
                ctx.arc(x, y, 10, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${i + time}, 100%, 50%)`;
                ctx.fill();
            }
        }

        function pattern2() {
            const width = canvas.width;
            const height = canvas.height;
            for (let x = 0; x < width; x += 50) {
                for (let y = 0; y < height; y += 50) {
                    ctx.fillStyle = `hsl(${(x + y + time) % 360}, 100%, 50%)`;
                    ctx.fillRect(x, y, 40, 40);
                }
            }
        }

        function pattern3() {
            const width = canvas.width;
            const height = canvas.height;
            for (let x = 0; x < width; x += 30) {
                for (let y = 0; y < height; y += 30) {
                    ctx.beginPath();
                    ctx.arc(x, y, 10 + 5 * Math.sin((x + y + time) / 20), 0, Math.PI * 2);
                    ctx.fillStyle = `hsl(${(x + y + time) % 360}, 100%, 50%)`;
                    ctx.fill();
                }
            }
        }

        function pattern5() {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;

            for (let i = 0; i < 360; i += 5) {
                const angle = (i + time) * Math.PI / 180;
                const x = centerX + Math.cos(angle) * 300;
                const y = centerY + Math.sin(angle) * 300;

                ctx.fillStyle = `hsl(${(i + time) % 360}, 100%, 50%)`;
                ctx.beginPath();
                ctx.arc(x, y, 20, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function pattern6() {
            const width = canvas.width;
            const height = canvas.height;
            for (let x = 0; x < width; x += 20) {
                for (let y = 0; y < height; y += 20) {
                    ctx.fillStyle = `hsl(${(x + y + time) % 360}, 100%, 50%)`;
                    ctx.beginPath();
                    ctx.arc(x, y, 10, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        const patterns = [pattern1, pattern2, pattern3, pattern5, pattern6];

        function changePattern(index) {
            currentPattern = index;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            patterns[currentPattern]();
            time += speed;
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
